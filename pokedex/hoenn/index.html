<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokédex Hoenn</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
overflow:hidden;

font-family:Arial,sans-serif;

background:
linear-gradient(
135deg,
#061a4a,
#0879c9,
#063c8f,
#00a8d8
);

background-size:400% 400%;
animation:bg 12s ease infinite;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

color:white;
}

.background-pokemon{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:0;
}

.background-pokemon img{
position:absolute;
width:90px;
opacity:.22;

animation:
float 12s ease-in-out infinite;
}

.content{
position:relative;
z-index:10;
width:100%;
max-width:500px;
padding:20px;
}

h1{
font-size:42px;
text-align:center;
margin-bottom:10px;

text-shadow:
0 0 15px rgba(255,255,255,.8);
}

p{
text-align:center;
margin-bottom:35px;
opacity:.8;
}

.choices{
display:flex;
flex-direction:column;
gap:15px;
}

button{
border:1px solid rgba(255,255,255,.4);

border-radius:18px;

padding:22px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(10px);

color:white;

font-size:22px;
font-weight:bold;

cursor:pointer;

transition:.2s;
}

button:hover{
background:rgba(255,255,255,.22);
transform:translateY(-3px);
}

.back{
margin-top:20px;
font-size:16px;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

@keyframes float{
0%,100%{
transform:translateY(0px);
}
50%{
transform:translateY(-20px);
}
}

</style>

</head>

<body>

<div
class="background-pokemon"
id="pokemonBg"
></div>

<div class="content">

<h1>Hoenn</h1>

<p>Choisis ton Pokédex</p>

<div class="choices">

<button onclick="window.location.href='regional/'">
Pokédex régional
</button>

<button onclick="window.location.href='megadex/'">
Mégadex
</button>

<button onclick="window.location.href='national/'">
Pokédex national
</button>

<button
class="back"
onclick="window.location.href='../../index.html'"
>
← Retour à l'accueil
</button>

</div>

</div>

<script>

const bg =
document.getElementById("pokemonBg");

const hoennPokemon = [

252,253,254,
255,256,257,
258,259,260,
261,262,263,264,
265,266,267,268,269,
270,271,272,
273,274,275,
276,277,
278,279,
280,281,282,
283,284,
285,286,
287,288,289,
290,291,292,
293,294,295,
296,297,
298,299,
300,301,
302,
303,
304,305,306,
307,308,
309,310,
311,312,
313,314,
315,
316,317,
318,319,
320,321,
322,323,
324,
325,326,
327,
328,329,330,
331,332,
333,334,
335,336,
337,338,
339,340,
341,342,
343,344,
345,346,
347,348,
349,350,
351,
352,
353,354,
355,356,
357,
358,
359,
360,
361,362,
363,364,365,
366,367,368,
369,
370,
371,372,373,
374,375,376,
377,378,379,
380,381,
382,383,384,
385,
386

];

const megaHoenn = [

];

const all =
[...hoennPokemon,...megaHoenn];

const used = [];

for(let i=0;i<50;i++){

let id;

do{
id =
all[
Math.floor(
Math.random()*all.length
)
];
}
while(used.includes(id));

used.push(id);

const img =
document.createElement("img");

img.src =
`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;

img.style.left =
Math.random()*92+"%";

img.style.top =
Math.random()*92+"%";

img.style.animationDelay =
Math.random()*10+"s";

bg.appendChild(img);

}

</script>

</body>
</html>
