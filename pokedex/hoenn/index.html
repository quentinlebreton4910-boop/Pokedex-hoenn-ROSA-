<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0879c9"
  >

  <title>Pokédex Hoenn</title>

  <!-- EXACTEMENT LE MÊME CSS QUE L'ACCUEIL -->
  <link
    rel="stylesheet"
    href="../../accueil.css"
  >

</head>


<body>

  <!-- FOND -->
  <div
    class="background-pokemon"
    id="pokemonBackground"
  ></div>


  <!-- CONTENU -->

  <main class="home">

    <h1>HOENN</h1>

    <p class="subtitle">
      Choisis ton Pokédex
    </p>


    <div class="region-list">


      <button
        class="region-card"
        onclick="window.location.href='regional/'"
      >

        <span>
          Pokédex régional
        </span>

        <small>
          Pokémon de Hoenn
        </small>

      </button>


      <button
        class="region-card"
        onclick="window.location.href='megadex/'"
      >

        <span>
          Mégadex
        </span>

        <small>
          Méga-Évolutions de Hoenn
        </small>

      </button>


      <button
        class="region-card"
        onclick="window.location.href='national/'"
      >

        <span>
          Pokédex national
        </span>

        <small>
          Pokédex national de ROSA
        </small>

      </button>


      <button
        class="region-card"
        onclick="window.location.href='../../index.html'"
      >

        <span>
          ← Retour à l'accueil
        </span>

        <small>
          Choisir une autre région
        </small>

      </button>


    </div>

  </main>


  <script src="../../accueil.js"></script>


  <script>

    /*
     * IMPORTANT :
     * on demande au même générateur que l'accueil
     * d'utiliser uniquement Hoenn.
     */

    createPokemonBackground("hoenn");

  </script>

</body>

</html>
